name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1; verify before intentionally updating.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks/gitleaks-action v3.0.0; verify before intentionally updating.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nur bei Repositories einer GitHub-Organisation nötig (nicht bei persönlichen Konten):
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
