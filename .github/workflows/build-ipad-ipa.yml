name: iPad simulator live-update verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build simulator app
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build_output CODE_SIGNING_ALLOWED=NO build > /tmp/cloudki-simulator-build.log 2>&1 || { tail -n 80 /tmp/cloudki-simulator-build.log; exit 1; }
      - name: Check and install the real GitHub release on a simulated iPad
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json >/tmp/cloudki-devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("/tmp/cloudki-devices.json")); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS-18-5" in runtime for x in devices if x["name"] == "iPad Pro 11-inch (M4)"))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build_output/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.xleonttv.cloudkibridge
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.xleonttv.cloudkibridge data)
          for i in $(seq 1 140); do [ -f "$DATA/Documents/cloudki-after.txt" ] && break; sleep 1; done
          test -f "$DATA/Documents/cloudki-before.txt"
          test -f "$DATA/Documents/cloudki-after.txt"
          echo 'UI before installation:'
          cat "$DATA/Documents/cloudki-before.txt"
          echo 'Status after installation:'
          cat "$DATA/Documents/cloudki-after.txt"
          python3 - "$DATA/Documents/cloudki-before.txt" "$DATA/Documents/cloudki-after.txt" <<'PY'
          import json, sys
          ui=open(sys.argv[1]).read()
          assert 'Live-Update bereit' in ui, 'Updater did not become ready in the UI'
          assert 'ist verfügbar' in ui or 'Update installieren' in ui, 'Update check did not display an available update'
          data=json.load(open(sys.argv[2])); stored=json.loads(data['stored']); current=json.loads(data['current'])
          assert 'error' not in stored, stored
          assert current['bundleId'] == stored['targetBundle'], (stored,current)
          print('Real GitHub update downloaded, activated and reloaded successfully.')
          PY
