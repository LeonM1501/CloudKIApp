name: Build Unsigned iPadOS IPA (Sideloadly / AltStore / SideStore)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipad-ipa:
    name: Build CloudKIBridge-iPadOS.ipa
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Dependencies & Build iPad Web Bundle
        run: |
          npm ci
          npm test
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Resolve Swift Packages & Compile Unsigned iPadOS App (Xcode)
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into Sideloadable CloudKIBridge-iPadOS.ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/App.app Payload/
          zip -r9 CloudKIBridge-iPadOS.ipa Payload

      - name: Upload CloudKIBridge-iPadOS.ipa Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CloudKIBridge-iPadOS-IPA
          path: CloudKIBridge-iPadOS.ipa
          retention-days: 30
