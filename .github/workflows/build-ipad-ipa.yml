name: iOS update diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: macos-15
    steps:
      - name: Check Swift Foundation bridge behavior
        run: |
          cat > /tmp/cloudki-bridge-check.swift <<'SWIFT'
          import Foundation
          protocol JSValue {}
          extension String: JSValue {}
          extension Bool: JSValue {}
          extension Int: JSValue {}
          extension Float: JSValue {}
          extension Double: JSValue {}
          extension NSNumber: JSValue {}
          extension NSNull: JSValue {}
          extension Array: JSValue {}
          extension Date: JSValue {}
          extension Dictionary: JSValue where Key == String, Value == JSValue {}
          typealias JSObject = [String: JSValue]
          let samples: [(String, JSObject)] = [
            ("null_bundle", ["bundleId": NSNull()]),
            ("string_version", ["versionName": "2.0.0"]),
            ("empty_array", ["bundleIds": [String]()]),
            ("string_bundle", ["bundleId": "web-2.0"]),
            ("ready", ["currentBundleId": NSNull(), "previousBundleId": NSNull(), "rollback": false])
          ]
          for (name, value) in samples {
            let boxed: AnyObject = value as AnyObject
            print("\(name): JSObject=\(boxed is JSObject) AnyDictionary=\(boxed is [String: Any])")
          }
          SWIFT
          swift /tmp/cloudki-bridge-check.swift
      - name: Check simulator availability
        run: xcrun simctl list devices available | head -45
