name: OSV dependency baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-main:
    # google/osv-scanner-action v2.6.0; verify before intentionally updating.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
    with:
      fail-on-vuln: true
      scan-args: |-
        --include-git-root
        --recursive
        ./
